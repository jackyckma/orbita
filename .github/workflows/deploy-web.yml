name: Deploy web (Cloudflare Pages)

# Publishes the public site (apps/orbita-web + rendered docs/site) to the Cloudflare
# Pages project `orbita-web` by running the SAME script a human would run by hand:
# scripts/deploy-web.sh. Keep it that way: one deployment path, no drift.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   (custom token: Account > Cloudflare Pages > Edit)
#   CLOUDFLARE_ACCOUNT_ID
#
# Manual run: Actions tab > "Deploy web (Cloudflare Pages)" > Run workflow.

on:
  push:
    branches: [main]
    paths:
      - "apps/orbita-web/**"
      - "docs/site/**"
      - "scripts/build-web-docs.sh"
      - "scripts/build-web-docs.mjs"
      - "scripts/deploy-web.sh"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Never run two deployments at once; let a running one finish.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fail early if the Cloudflare secrets are missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-web.sh
